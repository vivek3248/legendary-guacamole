
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parking Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .spot {
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .available {
      background-color: #28a745;
    }
    .occupied {
      background-color: #dc3545;
    }
  </style>
</head>
<body>
  <h1>Parking Dashboard</h1>
  <div class="dashboard" id="dashboard">
    <!-- Parking spots -->
    <div class="spot available" onclick="toggleSpot(this)">Spot 1</div>
    <div class="spot occupied" onclick="toggleSpot(this)">Spot 2</div>
    <div class="spot available" onclick="toggleSpot(this)">Spot 3</div>
    <div class="spot occupied" onclick="toggleSpot(this)">Spot 4</div>
    <div class="spot available" onclick="toggleSpot(this)">Spot 5</div>
    <div class="spot available" onclick="toggleSpot(this)">Spot 6</div>
    <div class="spot occupied" onclick="toggleSpot(this)">Spot 7</div>
    <div class="spot available" onclick="toggleSpot(this)">Spot 8</div>
  </div>

  <script>
    function toggleSpot(element) {
      if (element.classList.contains('available')) {
        element.classList.remove('available');
        element.classList.add('occupied');
      } else {
        element.classList.remove('occupied');
        element.classList.add('available');
      }
    }
  </script>
</body>
</html>
